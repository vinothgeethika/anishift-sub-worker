name: Subtitle Processing Workflow

on:
  repository_dispatch:
    types: [process_subtitle_job]

concurrency:
  group: sub-worker-${{ github.event.client_payload.episode_path }}
  cancel-in-progress: true

jobs:
  process_subtitle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-sub-pip-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-sub-pip-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-core==2.34.0 requests firebase-admin pysubs2 deep-translator requests-toolbelt beautifulsoup4 python-dotenv chardet

      - name: Setup Firebase Credentials
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            echo "$FIREBASE_JSON" > serviceAccountKey.json
            mkdir -p sub_manager uploader
            echo "$FIREBASE_JSON" > sub_manager/serviceAccountKey.json
            echo "$FIREBASE_JSON" > uploader/serviceAccountKey.json
          fi

      - name: Run Cloud Subtitle Worker
        env:
          PYTHONUNBUFFERED: 1
          JOB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          RPMSHARE_API_TOKEN: ${{ secrets.RPMSHARE_API_TOKEN }}
          RPMSHARE_API_TOKEN_2: ${{ secrets.RPMSHARE_API_TOKEN_2 }}
          GITHUB_TOKEN: ${{ secrets.SUB_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.SUB_GITHUB_REPO || github.repository }}
        run: |
          if [ -f "sub_manager/sub_worker.py" ]; then
            python sub_manager/sub_worker.py
          elif [ -f "sub_worker.py" ]; then
            python sub_worker.py
          else
            python uploader/sub_worker.py
          fi

